<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Supports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#b9c3e8;
    --cream:#e6e5dc;
    --ink:#111;
    --green:#1f3a14;
    --head:'Oswald','Arial Narrow',Impact,sans-serif;
    --body:'Lexend',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--cream);transition:background .25s}
  body.blue{background:var(--blue)}
  a{color:var(--green)}
  a:focus-visible,button:focus-visible{outline:3px solid #2b4fd6;outline-offset:3px;border-radius:4px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;border-bottom:2px solid var(--ink);font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .topbar a{text-decoration:none;color:var(--ink)}
  .topbar a:hover{text-decoration:underline}
  .topbar .crumb{color:var(--green)}

  main{max-width:1080px;margin:0 auto;padding:28px 22px 40px}
  h1{font-family:var(--head);font-weight:700;line-height:.95;margin:0;text-align:center;letter-spacing:-.005em}
  .pagenum{font-size:12px;font-weight:600;letter-spacing:.06em}

  /* ---------- Start page (page 1) ---------- */
  .start h1{font-size:clamp(64px,15vw,190px);text-transform:uppercase}
  .start h1 span{display:block;font-size:.78em}
  .startlinks{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:48px;text-align:center}
  .startlinks a{font-weight:600;font-size:clamp(14px,1.8vw,18px);text-transform:uppercase;line-height:1.35;padding:14px 10px;border:2px solid transparent;border-radius:10px;transition:border-color .15s,background .15s}
  .startlinks a:hover{border-color:var(--green);background:rgba(255,255,255,.35)}

  /* ---------- Theorems menu ---------- */
  .menu-head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
  .theorems h1{font-size:clamp(56px,10vw,120px);text-transform:uppercase}
  .thm-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 70px;max-width:760px;margin:30px auto 10px}
  .thm-links a{font-family:var(--head);font-weight:700;font-size:clamp(64px,11vw,128px);line-height:1.05;color:var(--green);text-decoration:underline;text-decoration-thickness:.07em;text-underline-offset:.08em}
  .thm-links a:hover{color:#3d6b28}

  /* ---------- Hub pages (Congruent Sides / Angles) ---------- */
  .hub h1{font-size:clamp(46px,8.5vw,104px);text-transform:uppercase}
  .hub .prompt{text-align:center;text-transform:uppercase;font-size:clamp(14px,1.7vw,18px);margin:22px 0 14px;letter-spacing:.02em}
  .thumbs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:18px}
  .thumb{display:flex;flex-direction:column;align-items:center;gap:4px;width:180px;padding:10px 8px;text-decoration:none;color:var(--ink);border:2px solid transparent;border-radius:12px;transition:border-color .15s,background .15s,transform .15s}
  .thumb:hover{border-color:var(--green);background:rgba(255,255,255,.4);transform:translateY(-2px)}
  .thumb svg{width:100%;height:120px}
  .thumb span{font-family:var(--head);font-weight:600;font-size:17px;text-align:center;line-height:1.1}
  .vocab{margin:4px 0 0 28px;padding:0;font-size:17px;line-height:1.7}
  .vocab a{font-weight:600}

  /* ---------- Detail pages ---------- */
  .detail h1{font-size:clamp(44px,8vw,96px)}
  .detail-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;margin-top:22px}
  .figure{text-align:center}
  .figure svg{width:100%;max-width:400px;height:auto}
  .caption{font-family:var(--head);font-weight:600;font-size:clamp(20px,2.6vw,28px);margin-top:4px}
  .caption.math{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-weight:700;font-size:clamp(24px,3vw,34px)}
  .ol{text-decoration:overline}
  .info{border-left:2px solid var(--ink);padding-left:26px}
  .info section{padding:8px 0 12px;border-bottom:2px solid var(--ink)}
  .info section:last-child{border-bottom:none}
  .info h2{font-family:var(--head);font-weight:700;font-size:clamp(24px,2.8vw,32px);margin:0 0 4px;text-transform:uppercase;letter-spacing:.005em}
  .info p{margin:0;font-size:clamp(15px,1.6vw,18px);line-height:1.4}

  .footer{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:34px;padding-top:12px;font-size:14px;font-weight:600}
  .footer .mid{flex:1;text-align:center}

  /* ---------- Site home ---------- */
  .home h1{font-size:clamp(56px,10vw,120px);text-transform:uppercase}
  .home .sub{text-align:center;font-size:18px;margin:10px 0 34px}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .unit{display:block;text-decoration:none;color:var(--ink);background:var(--blue);border:2px solid var(--ink);border-radius:14px;padding:18px;transition:transform .15s,box-shadow .15s}
  .unit:hover{transform:translateY(-3px);box-shadow:5px 5px 0 var(--ink)}
  .unit svg{width:100%;height:120px}
  .unit h3{font-family:var(--head);font-size:30px;margin:8px 0 2px;text-transform:uppercase}
  .unit p{margin:0;font-size:15px;line-height:1.4}

  svg .ln{stroke:#111;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
  svg .mk{stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:round}
  svg .lbl{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-weight:700;font-size:22px;fill:#111}

  @media (max-width:760px){
    .detail-grid{grid-template-columns:1fr}
    .info{border-left:none;border-top:2px solid var(--ink);padding-left:0;padding-top:8px}
    .startlinks{grid-template-columns:1fr}
    .thm-links{gap:4px 40px}
  }
</style>
</head>
<body>
<header class="topbar">
  <a href="#" id="homeLink">▲ Geometry Supports</a>
  <span class="crumb" id="crumb"></span>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   DRAWING HELPERS — build geometry diagrams as SVG
   ===================================================================== */
const P = (x,y)=>({x,y});
const sub=(a,b)=>P(a.x-b.x,a.y-b.y), add=(a,b)=>P(a.x+b.x,a.y+b.y), mul=(a,k)=>P(a.x*k,a.y*k);
const len=a=>Math.hypot(a.x,a.y), unit=a=>mul(a,1/len(a)), perp=a=>P(-a.y,a.x);
const f=n=>Math.round(n*10)/10;

function seg(a,b,cls='ln'){return `<line class="${cls}" x1="${f(a.x)}" y1="${f(a.y)}" x2="${f(b.x)}" y2="${f(b.y)}"/>`}
function poly(pts){return `<polygon class="ln" points="${pts.map(p=>f(p.x)+','+f(p.y)).join(' ')}"/>`}
// n tick marks at the midpoint of segment ab (congruent-side marks)
function ticks(a,b,n,t=0.5){
  const d=unit(sub(b,a)), nn=perp(d), m=add(a,mul(sub(b,a),t)); let s='';
  for(let i=0;i<n;i++){const c=add(m,mul(d,(i-(n-1)/2)*6));s+=seg(add(c,mul(nn,7)),add(c,mul(nn,-7)),'mk');}
  return s;
}
// n angle arcs at vertex v between rays toward p1 and p2
function arc(v,p1,p2,n=1,r=20){
  const u1=unit(sub(p1,v)),u2=unit(sub(p2,v)); const cross=u1.x*u2.y-u1.y*u2.x; const sw=cross>0?1:0; let s='';
  for(let i=0;i<n;i++){const R=r+i*6,a=add(v,mul(u1,R)),b=add(v,mul(u2,R));
    s+=`<path class="mk" d="M${f(a.x)} ${f(a.y)} A${R} ${R} 0 0 ${sw} ${f(b.x)} ${f(b.y)}"/>`;}
  return s;
}
// right-angle box at v between rays toward p1 and p2
function rt(v,p1,p2,s=13){
  const u1=mul(unit(sub(p1,v)),s),u2=mul(unit(sub(p2,v)),s);
  const a=add(v,u1),c=add(v,u2),b=add(a,u2);
  return `<polyline class="mk" points="${f(a.x)},${f(a.y)} ${f(b.x)},${f(b.y)} ${f(c.x)},${f(c.y)}"/>`;
}
// n chevrons (parallel marks) at the midpoint of ab, pointing a→b
function chev(a,b,n=2){
  const d=unit(sub(b,a)),nn=perp(d),m=mul(add(a,b),.5);let s='';
  for(let i=0;i<n;i++){const tip=add(m,mul(d,(i-(n-1)/2)*8+4));
    s+=`<polyline class="mk" points="${f(add(add(tip,mul(d,-7)),mul(nn,6)).x)},${f(add(add(tip,mul(d,-7)),mul(nn,6)).y)} ${f(tip.x)},${f(tip.y)} ${f(add(add(tip,mul(d,-7)),mul(nn,-6)).x)},${f(add(add(tip,mul(d,-7)),mul(nn,-6)).y)}"/>`;}
  return s;
}
function lbl(t,x,y,size){return `<text class="lbl" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"${size?` style="font-size:${size}px"`:''}>${t}</text>`}
function dot(p){return `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#111"/>`}
const ARROW=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>`;
function ray(a,b){return `<line class="ln" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" marker-start="url(#ah)" marker-end="url(#ah)"/>`}
const svg=(vb,body,label)=>`<svg viewBox="${vb}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;

/* ---------- Two-triangle base for the theorem pages ---------- */
const T1={A:P(80,40),B:P(45,150),C:P(210,105)}, T2={D:P(215,170),E:P(130,248),F:P(300,260)};
function twoTri(extra1,extra2){
  const {A,B,C}=T1,{D,E,F}=T2;
  return poly([A,B,C])+poly([D,E,F])+extra1+extra2+
    lbl('A',A.x+2,A.y-17)+lbl('B',B.x-14,B.y+10)+lbl('C',C.x+16,C.y+4)+
    lbl('D',D.x+2,D.y-17)+lbl('E',E.x-15,E.y+3)+lbl('F',F.x+14,F.y+6);
}

const DIAGRAMS={
  sss(){const {A,B,C}=T1,{D,E,F}=T2;return svg('0 0 340 285',twoTri(
    ticks(A,B,2)+ticks(A,C,3)+ticks(B,C,1),ticks(D,E,2)+ticks(D,F,3)+ticks(E,F,1)),'Triangles ABC and DEF with three pairs of congruent sides')},
  sas(){const {A,B,C}=T1,{D,E,F}=T2;return svg('0 0 340 285',twoTri(
    ticks(A,B,1)+ticks(A,C,2)+arc(A,B,C,1),ticks(D,E,1)+ticks(D,F,2)+arc(D,E,F,1)),'Triangles with two pairs of congruent sides and the included angle')},
  aas(){const {A,B,C}=T1,{D,E,F}=T2;return svg('0 0 340 285',twoTri(
    arc(A,B,C,1)+arc(B,C,A,2)+ticks(B,C,1),arc(D,E,F,1)+arc(E,F,D,2)+ticks(E,F,1)),'Triangles with two pairs of congruent angles and a non-included side')},
  asa(){const {A,B,C}=T1,{D,E,F}=T2;return svg('0 0 340 285',twoTri(
    arc(A,B,C,1)+arc(B,C,A,2)+ticks(A,B,1),arc(D,E,F,1)+arc(E,F,D,2)+ticks(D,E,1)),'Triangles with two pairs of congruent angles and the included side')},
  hl(){const A=P(70,30),B=P(70,125),C=P(220,125),D=P(275,150),E=P(275,245),F=P(125,245);
    return svg('0 0 330 275',poly([A,B,C])+poly([D,E,F])+rt(B,A,C)+rt(E,D,F)+ticks(A,B,2)+ticks(A,C,1)+ticks(D,E,2)+ticks(D,F,1)+
      lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+4)+lbl('C',C.x+16,C.y+4)+lbl('D',D.x+4,D.y-16)+lbl('E',E.x+16,E.y+4)+lbl('F',F.x-16,F.y+2),'Two right triangles with congruent hypotenuses and one pair of congruent legs')},
  reflexive(){const B=P(150,25),A=P(50,125),C=P(250,125),D=P(150,225);
    return svg('0 0 300 250',poly([B,A,D,C])+seg(A,C)+ticks(A,C,2)+lbl('B',B.x,B.y-14)+lbl('A',A.x-16,A.y)+lbl('C',C.x+16,C.y)+lbl('D',D.x,D.y+16),'Kite ABCD with shared diagonal AC')},
  midpoint(){const A=P(150,30),B=P(40,215),C=P(260,215),M=P(150,215);
    return svg('0 0 300 250',poly([A,B,C])+dot(M)+ticks(B,M,2)+ticks(M,C,2)+lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+4)+lbl('C',C.x+16,C.y+4)+lbl('M',M.x,M.y+20),'Triangle ABC with midpoint M on BC')},
  isoSides(){const A=P(150,30),B=P(55,215),C=P(245,215);
    return svg('0 0 300 250',poly([A,B,C])+ticks(A,B,1)+ticks(A,C,1)+lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+6)+lbl('C',C.x+16,C.y+6),'Isosceles triangle ABC with AB congruent to AC')},
  isoAngles(){const A=P(150,30),B=P(55,215),C=P(245,215);
    return svg('0 0 300 250',poly([A,B,C])+ticks(A,B,1)+ticks(A,C,1)+arc(B,C,A,1,26)+arc(C,A,B,1,26)+lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+6)+lbl('C',C.x+16,C.y+6),'Isosceles triangle with congruent base angles B and C')},
  median(){const A=P(115,30),B=P(35,215),C=P(275,215),M=P(155,215);
    return svg('0 0 310 250',poly([A,B,C])+seg(A,M)+ticks(B,M,1)+ticks(M,C,1)+lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+4)+lbl('C',C.x+16,C.y+4)+lbl('M',M.x,M.y+20),'Triangle ABC with median AM')},
  segBisector(){
    const B1=P(40,70),C1=P(260,70),M1=P(150,70),B2=P(40,215),C2=P(260,215),M2=P(150,215);
    return svg('0 0 300 290',ARROW+seg(B1,C1)+dot(B1)+dot(C1)+ray(P(195,12),P(105,128))+ticks(B1,M1,1)+ticks(M1,C1,1)+
      lbl('B',B1.x-16,B1.y)+lbl('C',C1.x+16,C1.y)+lbl('M',M1.x+18,M1.y+16)+lbl('l',203,14)+
      seg(B2,C2)+dot(B2)+dot(C2)+ray(P(150,158),P(150,272))+rt(M2,P(150,158),C2,12)+ticks(B2,M2,1,.45)+ticks(M2,C2,1,.55)+
      lbl('B',B2.x-16,B2.y)+lbl('C',C2.x+16,C2.y)+lbl('M',M2.x-14,M2.y+17)+lbl('l',162,160),'A segment bisector and a perpendicular bisector through midpoint M')},
  angleBisector(){const A=P(150,30),B=P(40,215),C=P(260,215),D=P(150,215);
    return svg('0 0 300 250',poly([A,B,C])+seg(A,D)+arc(A,B,D,1,26)+arc(A,D,C,1,26)+lbl('A',A.x,A.y-16)+lbl('B',B.x-16,B.y+4)+lbl('C',C.x+16,C.y+4)+lbl('D',D.x,D.y+20),'Triangle ABC with angle bisector AD')},
  vertical(){const A=P(40,55),B=P(40,205),C=P(260,55),D=P(260,205),O=P(150,130);
    return svg('0 0 300 250',seg(A,D)+seg(B,C)+seg(A,B)+seg(C,D)+arc(O,A,B,1,28)+arc(O,D,C,1,28)+
      lbl('A',A.x-14,A.y-12)+lbl('B',B.x-14,B.y+14)+lbl('C',C.x+14,C.y-12)+lbl('D',D.x+14,D.y+14)+lbl('O',O.x,O.y+26),'Two lines intersecting at O forming vertical angles')},
  altInterior(){const A=P(95,55),B=P(265,55),C=P(215,205),D=P(40,205);
    return svg('0 0 310 250',seg(A,B)+seg(D,C)+seg(A,D)+seg(B,C)+seg(A,C)+chev(A,B,2)+chev(D,C,2)+arc(A,B,C,1,26)+arc(C,D,A,1,26)+
      lbl('A',A.x-10,A.y-16)+lbl('B',B.x+12,B.y-14)+lbl('C',C.x+12,C.y+16)+lbl('D',D.x-12,D.y+16),'Parallel lines AB and DC cut by transversal AC forming alternate interior angles')},
};

/* =====================================================================
   CONTENT — to add a new unit later, add an entry to UNITS and its
   pages to PAGES (each page id becomes a link like #page-id).
   ===================================================================== */
const UNITS=[
  {start:'congruence',title:'Triangle Congruence',blurb:'SSS, SAS, ASA, AAS, HL — plus help finding congruent sides and angles.',thumb:'sss'},
  // {start:'next-unit-id', title:'…', blurb:'…', thumb:'diagram-name'},
];

const BACK_START={href:'congruence',text:'Back to Start!'};
const toThm={href:'theorems',text:'Back to Congruence Theorems'};
const toSides={href:'sides',text:'Back to Congruent Sides'};
const toAngles={href:'angles',text:'Back to Congruent Angles'};

const PAGES={
  congruence:{type:'start',bg:'blue',unit:'Triangle Congruence',
    links:[['theorems','Click for Congruence Theorems'],['sides','I need help finding congruent sides'],['angles','I need help finding congruent angles']]},

  theorems:{type:'theorems',bg:'cream',unit:'Triangle Congruence',num:2,
    rows:[['sss','hl','aas'],['sas','asa']]},

  sss:{type:'detail',bg:'blue',title:'SSS: Side - Side - Side',fig:'sss',caption:'3 pairs of congruent sides',first:'Theorem',
    def:'If three sides of one triangle are congruent to three sides of another triangle, then the triangles are congruent.',
    look:'Three pairs of matching sides, shown by tick marks, equal lengths, or a shared side.',
    use:'Use SSS to prove triangles congruent when all three pairs of corresponding sides are congruent.',back:toThm,short:'SSS'},
  sas:{type:'detail',bg:'cream',title:'SAS: Side - Angle - Side',fig:'sas',caption:'2 sides + the included angle',first:'Theorem',
    def:'If two sides and the included angle of one triangle are congruent to the corresponding parts of another triangle, then the triangles are congruent.',
    look:'Two pairs of matching sides and the matching angle between them.',
    use:'Use SAS when the congruent angle is formed by the two congruent sides.',back:toThm,short:'SAS'},
  aas:{type:'detail',bg:'blue',title:'AAS: Angle - Angle - Side',fig:'aas',caption:'2 angles + a non-included side',first:'Theorem',
    def:'If two angles and a non-included side of one triangle are congruent to the corresponding parts of another triangle, then the triangles are congruent.',
    look:'Two pairs of matching angles and a matching side that is not between them.',
    use:'Use AAS when the congruent side is not between the two congruent angles.',back:toThm,short:'AAS'},
  asa:{type:'detail',bg:'cream',title:'ASA: Angle - Side - Angle',fig:'asa',caption:'2 angles + the included side',first:'Theorem',
    def:'If two angles and the included side of one triangle are congruent to the corresponding parts of another triangle, then the triangles are congruent.',
    look:'Two pairs of matching angles and the matching side between them.',
    use:'Use ASA when the congruent side connects the two congruent angles.',back:toThm,short:'ASA'},
  hl:{type:'detail',bg:'blue',title:'HL: Hypotenuse - Leg',fig:'hl',caption:'Hypotenuse + leg in right triangles',first:'Theorem',
    def:'If the hypotenuse and one leg of a right triangle are congruent to the corresponding parts of another right triangle, then the triangles are congruent.',
    look:'Two right triangles with matching hypotenuses and one pair of matching legs.',
    use:'Use HL only after establishing that both triangles are right triangles.',back:toThm,short:'HL'},

  sides:{type:'hub',bg:'cream',title:'Congruent Sides',num:8,unit:'Triangle Congruence',
    items:[['reflexive','Reflexive Property'],['midpoint','Midpoint'],['isosceles-sides','Isosceles Triangle: Sides','Isosceles Triangles'],['median','Median'],['segment-bisector','Segment Bisector']]},

  reflexive:{type:'detail',bg:'blue',title:'Reflexive Property',fig:'reflexive',caption:'<span class="ol">AC</span> ≅ <span class="ol">AC</span>',math:true,
    def:'A segment or angle is congruent to itself.',
    look:'A side or angle shared by the two triangles.',
    use:'Use the reflexive property to establish a congruent pair when both triangles share the same side or angle.',back:toSides},
  midpoint:{type:'detail',bg:'cream',title:'Midpoint',fig:'midpoint',caption:'BM ≅ MC',math:true,
    def:'A midpoint divides a segment into two congruent segments.',
    look:'A point on a segment that creates two equal lengths.',
    use:'Use a given midpoint to establish a pair of congruent segments in a triangle proof.',back:toSides},
  'isosceles-sides':{type:'detail',bg:'blue',title:'Isosceles Triangles: Sides',fig:'isoSides',caption:'AB ≅ AC',math:true,
    def:'An isosceles triangle has at least two congruent sides. If two angles of a triangle are congruent, then the sides opposite those angles are congruent.',
    look:'A triangle identified as isosceles, matching side marks, or two congruent angles.',
    use:'Use the definition of an isosceles triangle to establish congruent sides. If two angles are congruent, use the converse of the isosceles triangle theorem to establish congruent opposite sides.',
    back:toSides,cross:{href:'isosceles-angles',text:'Click to View Isosceles Triangles: Angles'}},
  median:{type:'detail',bg:'cream',title:'Median',fig:'median',
    def:'A median connects a vertex of a triangle to the midpoint of the opposite side.',
    look:'A segment from a vertex to the opposite side, with that side split into equal lengths.',
    use:'Use a given median to establish that the two parts of the opposite side are congruent. A median does not necessarily form right angles.',back:toSides},

    def:'A segment bisector passes through a segment’s midpoint. A perpendicular bisector also meets the segment at 90°.',
    look:'Two congruent parts of a segment. For a perpendicular bisector, also look for perpendicular lines or a right-angle mark.',

/* =====================================================================
   RENDERING
   ===================================================================== */
const app=document.getElementById('app'), crumb=document.getElementById('crumb');
const link=(h,t)=>`<a href="#${h}">${t}</a>`;

function renderHome(){
  document.body.className='';
  crumb.textContent='';
  return `<div class="home"><h1>Geometry Supports</h1>
    <p class="sub">Pick a topic to get started.</p>
    <div class="units">${UNITS.map(u=>`<a class="unit" href="#${u.start}">${DIAGRAMS[u.thumb]()}<h3>${u.title}</h3><p>${u.blurb}</p></a>`).join('')}</div></div>`;
}
function renderStart(p){
  return `<div class="start"><h1>Triangle<span>Congruence</span></h1>
    <nav class="startlinks">${p.links.map(([h,t])=>link(h,t)).join('')}</nav></div>`;
}
function headBar(p){return `<div class="menu-head"><span class="pagenum">PAGE ${p.num}</span>${link(BACK_START.href,BACK_START.text)}</div>`}
function renderTheorems(p){
  return `<div class="theorems">${headBar(p)}<h1>Theorems</h1>
    ${p.rows.map(r=>`<div class="thm-links">${r.map(id=>link(id,PAGES[id].short)).join('')}</div>`).join('')}</div>`;
}
function renderHub(p){
  return `<div class="hub">${headBar(p)}<h1>${p.title}</h1>
    <p class="prompt">Click on an image to learn more about it!</p>
    <div class="thumbs">${p.items.map(([id,label])=>`<a class="thumb" href="#${id}">${DIAGRAMS[PAGES[id].fig]()}<span>${label}</span></a>`).join('')}</div>
    <p class="prompt">Click on a vocabulary word to learn more about it!</p>
    <ul class="vocab">${p.items.map(([id,label,vocab])=>`<li>${link(id,vocab||label)}</li>`).join('')}</ul></div>`;
}
function renderDetail(p){
  const first=p.first||'Definition';
  const cap=p.caption?`<div class="caption${p.math?' math':''}">${p.caption}</div>`:'';
  const figExtra=p.figLabels?`<div class="caption" style="font-size:18px">${p.figLabels.join(' &nbsp;·&nbsp; ')}</div>`:'';
  return `<article class="detail"><h1>${p.title}</h1>
    <div class="detail-grid">
      <div class="figure">${DIAGRAMS[p.fig]()}${cap}${figExtra}</div>
      <div class="info">
        <section><h2>${first}</h2><p>${p.def}</p></section>
        <section><h2>What to look for</h2><p>${p.look}</p></section>
        <section><h2>When to use</h2><p>${p.use}</p></section>
      </div>
    </div>
    <nav class="footer">${link(p.back.href,p.back.text)}<span class="mid">${p.cross?link(p.cross.href,p.cross.text):''}</span>${link(BACK_START.href,BACK_START.text)}</nav></article>`;
}

function route(){
  const id=decodeURIComponent(location.hash.slice(1));
  const p=PAGES[id];
  if(!p){app.innerHTML=renderHome();document.title='Geometry Supports';window.scrollTo(0,0);return;}
  document.body.className=p.bg==='blue'?'blue':'';
  const unitName=p.unit||'Triangle Congruence';
  crumb.innerHTML=id==='congruence'?unitName:`${link('congruence',unitName)}`;
  app.innerHTML=({start:renderStart,theorems:renderTheorems,hub:renderHub,detail:renderDetail})[p.type](p);
  document.title=(p.title||unitName)+' · Geometry Supports';
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
